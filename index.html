<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Vaquero Valley: juego de rancho gratis para toda la familia.">
<meta name="theme-color" content="#6b4a2c">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

</head>
<body>
<title>Vaquero Valley</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: one-screen game. Wooden top bar, living 2D farm map in the middle, tool strip + tab bar at the bottom, sheets slide up over the map. Single deliberate daytime look. */
:root{
  --grass:#5d9a35; --grass-dk:#3c6e21; --grass-lt:#7bb84a;
  --wood:#8b5a2b; --wood-dk:#5e3a17; --wood-lt:#b07a41;
  --panel:#eef4dc; --panel-2:#dfe9c4; --ink:#2b2416; --ink-soft:#5d5440;
  --sun:#f6b80b; --sun-dk:#c98e00; --red:#c8432c; --ok:#2f8f4e; --cream:#fff7e0;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Baloo 2",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--wood-dk);color:var(--ink);font-family:var(--body);font-size:15px;margin:0;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:900px;margin:0 auto;position:relative;background:var(--grass)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.top{background:var(--wood);background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 2px,transparent 2px 9px);
  color:var(--cream);padding-block:8px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:4px solid var(--wood-dk);display:flex;align-items:center;gap:10px;flex:none;z-index:3}
.brand{font-family:var(--display);font-size:18px;line-height:1;text-shadow:0 2px 0 var(--wood-dk);white-space:nowrap}
.brand{background:none;border:0;color:inherit;text-align:left;padding:0;cursor:pointer}
.namebox input{width:100%;font:inherit;font-size:17px;font-weight:700;padding:10px 12px;border-radius:12px;border:2px solid var(--wood-lt);background:#fff;color:var(--ink);margin:4px 0 8px}
.namebox input:focus{outline:none;border-color:var(--sun)}
.namebox .sugs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}
.namebox .err{color:var(--red);font-weight:700;font-size:13px;min-height:18px;margin:0 0 6px}
.brand small{display:block;font-family:var(--body);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75;text-shadow:none;margin-top:3px}
.stats{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{background:var(--wood-dk);border-radius:999px;padding:3px 10px 3px 7px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;position:relative;white-space:nowrap}
.coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe27a,var(--sun) 55%,var(--sun-dk));box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);flex:none}
.pill .bar{position:absolute;left:8px;right:10px;bottom:1px;height:3px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
.pill .bar i{display:block;height:100%;background:var(--sun);transition:width .3s}
.pill.full{background:var(--red)}
button.pill{color:inherit;cursor:pointer;padding:3px 8px;font-size:15px}
@media (max-width:560px){.top{flex-wrap:wrap;row-gap:6px;padding-block:6px 7px}.brand{flex:1 1 100%;font-size:16px}.brand small{display:inline;margin:0 0 0 8px}.stats{margin-left:0;width:100%;flex-wrap:nowrap;justify-content:space-between;gap:4px}.pill{font-size:12.5px;padding:2px 7px 2px 5px;gap:3px}button.pill{font-size:12.5px;padding:2px 6px}.coin{width:13px;height:13px}}

#stage{flex:1;position:relative;overflow:hidden;min-height:0;touch-action:none}
canvas{display:block;width:100%;height:100%;cursor:pointer}
#gl{position:absolute;left:0;top:0;display:none}#cv{position:relative}body:not(.v3) .r3{display:none}
#placeBar{position:absolute;left:8px;right:8px;bottom:10px;display:flex;align-items:center;gap:8px;background:rgba(255,250,236,.97);border-radius:16px;padding:8px 10px;box-shadow:0 4px 0 var(--wood-dk),0 8px 20px rgba(0,0,0,.25);z-index:4}
#placeBar[hidden]{display:none}
#placeBar .ph{flex:1;font-size:13px;line-height:1.25;color:var(--ink)}#placeBar .ph span{font-size:11.5px;opacity:.8}
#quick{position:absolute;left:0;right:0;bottom:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
#quick .btn{pointer-events:auto;padding:6px 12px;font-size:13px;border-radius:11px}
#zoneChip{position:absolute;top:8px;left:max(10px,env(safe-area-inset-left,0px));border:0;color:#fffaf0;font:800 13px var(--body);padding:5px 10px 5px 8px;border-radius:12px;display:flex;align-items:center;gap:6px;box-shadow:0 2px 0 rgba(0,0,0,.25),inset 0 0 0 1.5px rgba(255,255,255,.35);cursor:pointer;max-width:68%;white-space:nowrap;overflow:hidden;text-shadow:0 1px 1px rgba(0,0,0,.35);transition:background .4s}
#zoneChip .zi{font-size:16px}#zoneChip .zc{opacity:.8;font-size:11px}
#zoneChip.pop{animation:zpop .35s ease}
@keyframes zpop{0%{transform:scale(.92)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
#zoneMenu{position:absolute;top:46px;left:max(10px,env(safe-area-inset-left,0px));z-index:7;background:var(--cream);border-radius:14px;padding:8px;box-shadow:0 4px 0 var(--wood-dk),0 10px 24px rgba(0,0,0,.25);width:min(330px,calc(100% - 20px))}
#zoneMenu .zm-h{font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:2px 4px 6px}
#zoneMenu .zm-g{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#zoneMenu button{background:#fff;border-radius:10px;padding:6px 8px;font-weight:800;font-size:12px;text-align:left;display:flex;align-items:center;gap:6px;border-left:5px solid var(--zc);box-shadow:0 2px 0 var(--panel-2);line-height:1.15;color:var(--ink)}
#zoneMenu button span{font-size:16px}
#status{position:absolute;top:46px;left:max(10px,env(safe-area-inset-left,0px));background:rgba(43,36,22,.72);color:var(--cream);font-weight:700;font-size:12px;
  border-radius:10px;padding:4px 10px;pointer-events:none;max-width:70%}
#zoom{position:absolute;top:8px;right:max(10px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px}
#zoom button{width:34px;height:34px;border-radius:10px;background:rgba(255,247,224,.92);font-weight:800;font-size:18px;box-shadow:0 2px 0 var(--wood-dk)}

.btn{background:var(--sun);color:var(--ink);font-weight:800;border-radius:12px;padding:8px 14px;box-shadow:0 3px 0 var(--sun-dk);
  display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:transform .08s;font-size:14px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sun-dk)}
.btn.ghost{background:var(--panel-2);box-shadow:0 3px 0 #b8c79a}
.btn.wood{background:var(--cream);box-shadow:0 3px 0 var(--wood-dk)}
.btn.danger{background:#f4d3cb;box-shadow:0 3px 0 #c99a8f;color:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:10px}
.btn.grow{flex:1}

.tools{flex:none;background:var(--wood-lt);border-top:3px solid var(--wood-dk);display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;
  padding-block:7px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.tools::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--cream);border-radius:11px;padding:4px 9px 4px 6px;display:flex;align-items:center;gap:5px;font-weight:800;font-size:13px;
  box-shadow:0 3px 0 var(--wood-dk);border:2px solid transparent;line-height:1.05;text-align:left}
.chip .e{font-size:20px;line-height:1}
.chip small{display:block;font-size:10.5px;color:var(--ink-soft);font-weight:700}
.chip.on{border-color:var(--ink);background:#fff1b8}
.chip.locked{opacity:.5}

#invbar{flex:none;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;background:var(--wood-dk);padding-block:5px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));cursor:pointer;z-index:3;min-height:31px;align-items:center}
#invbar::-webkit-scrollbar{display:none}
#invbar .it{flex:none;display:flex;align-items:center;gap:3px;background:rgba(255,247,224,.13);color:var(--cream);border-radius:999px;padding:2px 9px 2px 6px;font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.3}
#invbar .it.mat{background:rgba(170,205,255,.16)}
#invbar .sep{flex:none;width:1px;align-self:stretch;background:rgba(255,247,224,.28);margin:2px 2px}
#invbar .lbl{flex:none;color:rgba(255,247,224,.6);font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
#invbar .empty{color:rgba(255,247,224,.7);font-size:12px;font-weight:700}
nav{flex:none;display:grid;grid-template-columns:repeat(8,1fr);background:var(--wood);border-top:3px solid var(--wood-dk);
  padding-block:4px max(5px,env(safe-area-inset-bottom,0px));padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
nav button{color:#f3dcc2;display:flex;flex-direction:column;align-items:center;gap:0;font-size:10.5px;font-weight:800;padding:3px 0;border-radius:10px;position:relative}
nav button .e{font-size:19px;line-height:1.15}
nav button.on{background:var(--wood-dk);color:#fff}
nav .badge{position:absolute;top:1px;right:calc(50% - 22px);background:var(--sun);color:var(--ink);border-radius:999px;font-size:10px;min-width:16px;height:16px;line-height:16px;padding:0 4px}

/* bottom sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:74%;background:var(--panel);border-radius:20px 20px 0 0;z-index:8;
  box-shadow:0 -6px 0 var(--grass-dk),0 -12px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;transform:translateY(0);transition:transform .22s ease}
#sheet[hidden]{display:none!important}
.sheet-head{display:flex;align-items:center;gap:10px;padding-block:12px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-head h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;color:var(--wood-dk);flex:1;text-wrap:balance}
.close{width:34px;height:34px;border-radius:10px;background:var(--panel-2);font-weight:800;font-size:18px}
.sheet-body{overflow-y:auto;display:flex;flex-direction:column;gap:10px;
  padding-block:2px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(18px,env(safe-area-inset-bottom,0px))}
.sub{font-size:13px;font-weight:600;color:var(--ink-soft);margin:0;line-height:1.4}
h3{font-family:var(--display);font-weight:400;font-size:17px;margin:6px 0 0;color:var(--wood-dk)}
.card{background:#fff;border-radius:14px;padding:9px 11px;display:flex;align-items:center;gap:11px;box-shadow:0 3px 0 var(--panel-2)}
.card .ava img{width:100%;height:100%;object-fit:contain}
.card .ava{width:46px;height:46px;flex:none;border-radius:12px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-size:28px}
.card .info{flex:1;min-width:0}
.card .nm{font-weight:800;font-size:15px;line-height:1.15}
.card .ds{font-size:12.5px;color:var(--ink-soft);font-weight:600;line-height:1.3}
.card .acts{display:flex;flex-direction:column;gap:6px;flex:none}
.card.locked{opacity:.6}
.card.hl{box-shadow:0 0 0 3px var(--sun),0 3px 0 var(--panel-2)}
.label{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
.tag{display:inline-block;background:var(--sun);color:var(--ink);font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:1px 6px;vertical-align:middle}
.tag.red{background:#f4d3cb;color:var(--red)} .tag.green{background:#d3ecd9;color:var(--ok)}
.need{display:flex;gap:10px;flex-wrap:wrap;font-weight:800;font-variant-numeric:tabular-nums}
.need .miss{color:var(--red)}
.trend{font-size:12px;font-weight:800;margin-left:3px} .up{color:var(--ok)} .down{color:var(--red)}
.note{background:var(--panel-2);border-radius:12px;padding:9px 11px;font-size:13px;font-weight:600;line-height:1.4;color:var(--ink-soft)}
.note b{color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.meter{height:8px;border-radius:5px;background:var(--panel-2);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--ok)}

#toast{position:absolute;left:50%;top:44px;transform:translate(-50%,-10px);background:var(--ink);color:#fff;padding:7px 14px;border-radius:12px;font-weight:700;
  opacity:0;pointer-events:none;transition:.25s;max-width:calc(100% - 32px);text-align:center;z-index:9;font-size:13.5px}
#toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:absolute;inset:0;background:rgba(30,40,15,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:24px}
.modal .box{background:var(--panel);border-radius:18px;padding:20px;text-align:center;max-width:320px;box-shadow:0 6px 0 var(--grass-dk)}
.modal h3{font-size:30px;margin:0}
.modal p{margin:6px 0 14px;font-weight:600;color:var(--ink-soft)}
#picker{position:absolute;z-index:6;background:var(--cream);border-radius:14px;padding:8px;width:228px;display:flex;flex-direction:column;gap:7px;
  box-shadow:0 4px 0 var(--wood-dk),0 10px 24px rgba(0,0,0,.25)}
#picker .hd{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px;gap:6px}
#picker .hd .close{width:28px;height:28px;font-size:14px}
#picker .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#picker .crop{background:#fff;border-radius:10px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:12px;box-shadow:0 2px 0 var(--panel-2);line-height:1.1}
#picker .crop .e{font-size:24px;line-height:1.1}
#picker .crop small{font-size:10px;color:var(--ink-soft);font-weight:700}
#picker .crop[disabled]{opacity:.45}
#picker .crop.last{box-shadow:0 0 0 2px var(--sun)}
#picker .all{font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;color:var(--ink-soft);padding:2px}
#picker .all i{width:18px;height:18px;border-radius:5px;border:2px solid var(--wood);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;color:var(--ink)}
#picker .all.on i{background:var(--sun)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <header class="top">
    <button class="brand" id="brandBtn" type="button" aria-label="Cambiar el nombre de tu granja">Vaquero Valley<small id="houseName">Choza</small></button>
    <div class="stats">
      <button class="pill" id="soundBtn" type="button" aria-label="Sonido">🔊</button><button class="pill" id="cloudBtn" type="button" aria-label="Tu cuenta">☁️</button>
      <div class="pill" title="Nivel">Nv <span id="lvl">1</span><div class="bar"><i id="xpbar"></i></div></div>
      <button class="pill" id="waterPill" title="Agua" aria-label="Agua">💧 <span id="water">0</span></button><button class="pill" id="storePill" title="Bodegas" aria-label="Bodegas"><span id="store">0/50</span></button>
      <div class="pill"><span class="coin"></span><span id="coins">0</span></div>
    </div>
  </header>
  <div id="invbar" role="button" tabindex="0" aria-label="Lo que tienes. Toca para ver tu bodega"></div>
  <div id="stage">
    <canvas id="gl" aria-hidden="true"></canvas><canvas id="cv" aria-label="Mapa de la granja"></canvas>
    <button id="zoneChip" type="button" aria-label="Zona actual. Toca para ir a otra zona"></button><div id="zoneMenu" hidden></div><div id="status"></div>
    <div id="zoom"><button id="zin" aria-label="Acercar">+</button><button id="zout" aria-label="Alejar">−</button><button id="rotL" class="r3" aria-label="Girar a la izquierda">⟲</button><button id="rotR" class="r3" aria-label="Girar a la derecha">⟳</button><button id="viewBtn" aria-label="Cambiar entre vista 3D e isométrica" style="font-size:12px">3D</button></div>
    <div id="quick"></div><div id="placeBar" hidden></div>
    <div id="picker" hidden></div>
    <div id="toast"></div>
  </div>
  <div class="tools" id="tools"></div>
  <nav id="nav">
    <button data-p="construir"><span class="e">🏗️</span>Construir<span class="badge" id="bBuild" hidden></span></button>
    <button data-p="pedidos"><span class="e">📋</span>Pedidos<span class="badge" id="bOrders" hidden></span></button>
    <button data-p="vender"><span class="e">🧺</span>Vender</button>
    <button data-p="animales"><span class="e">🐄</span>Animales<span class="badge" id="bSick" hidden></span></button>
    <button data-p="mejorar"><span class="e">🔨</span>Mejorar<span class="badge" id="bUp" hidden></span></button>
    <button data-p="fabricas"><span class="e">🏭</span>Fábricas</button>
    <button data-p="equipo"><span class="e">👷</span>Equipo</button>
    <button data-p="tienda"><span class="e">🧪</span>Tienda</button>
  </nav>
  <div id="sheet" hidden><div class="sheet-head"><h2 id="sheetTitle"></h2><button class="close" id="sheetClose" aria-label="Cerrar">✕</button></div><div class="sheet-body" id="sheetBody"></div></div>
</div>

<script>
(function(){
'use strict';
// ================= DATOS =================
const CROPS={
  maiz:{n:'Maíz',i:'🌽',t:5,cost:1,y:3,p:3,xp:1,lv:1},
  trigo:{n:'Trigo',i:'🌾',t:7,cost:2,y:3,p:4,xp:2,lv:1},
  zanahoria:{n:'Zanahoria',i:'🥕',t:10,cost:4,y:3,p:7,xp:3,lv:3},
  girasol:{n:'Girasol',i:'🌻',t:14,cost:6,y:2,p:16,xp:4,lv:5},
  tomate:{n:'Tomate',i:'🍅',t:18,cost:8,y:3,p:14,xp:5,lv:7},
};
const PRODUCTS={leche:{n:'Leche',i:'🥛',p:14},lana:{n:'Lana',i:'🧶',p:26},queso:{n:'Queso',i:'🧀',p:42}};
const PROCESSED={
  masa:{n:'Masa de maíz',i:'🥣',p:16},harina:{n:'Harina',i:'🍚',p:20},tortillas:{n:'Tortillas',i:'🫓',p:52},pan:{n:'Pan',i:'🍞',p:85},aceite:{n:'Aceite de girasol',i:'🫙',p:75},salsa:{n:'Salsa de tomate',i:'🌶️',p:66},
  crema:{n:'Crema',i:'🍶',p:44},mantequilla:{n:'Mantequilla',i:'🧈',p:135},helado:{n:'Helado',i:'🍦',p:160},
  hilo:{n:'Hilo',i:'🧵',p:80},tela:{n:'Tela',i:'🪡',p:240},bufanda:{n:'Bufanda',i:'🧣',p:450},sueter:{n:'Suéter',i:'🧥',p:780},poncho:{n:'Poncho',i:'👘',p:1000},
  res:{n:'Carne de res básica',i:'🥩',p:40},resprimera:{n:'Res de primera',i:'🍖',p:72},premium:{n:'Corte premium',i:'🥇',p:160},carnecabra:{n:'Carne de cabra',i:'🍗',p:80},borrego:{n:'Carne de borrego',i:'🥓',p:50},chorizo:{n:'Chorizo',i:'🌭',p:70},barbacoa:{n:'Barbacoa',i:'🌮',p:170},

  return best;
}

// ================= FÁBRICAS =================
const fabCap=f=>2+f.lv;
const recipeTime=(fid,r)=>RECIPES[r].t*1000*(1-.15*(S.fab[fid].lv-1));
const pickAnimal=type=>S.animals.filter(a=>a.type===type&&a.stage===2&&!a.sick&&!a.away&&!a.spec&&!a.s).sort((x,y)=>animalValue(x)-animalValue(y))[0];
const pickHorse=min=>S.animals.filter(a=>a.type==='caballo'&&a.stage===2&&!a.sick&&!a.away&&!a.spec&&!a.s&&a.train>=min).sort((x,y)=>x.train-y.train)[0];
function canMake(fid,rid){
  const R=RECIPES[rid],f=S.fab[fid];
  if(!f.lv||f.buildEnd)return 'La fábrica no está lista';
  if(R.lv>f.lv)return `Requiere fábrica nivel ${R.lv}`;
  if(f.jobs.length>=fabCap(f))return 'La fila está llena';
  for(const[k,q]of Object.entries(R.in||{}))if(amt(k)<q)return `Falta ${q-amt(k)} ${itemInfo(k).i} ${itemInfo(k).n.toLowerCase()}`;
  if(R.animal&&!pickAnimal(R.animal))return `Necesitas una ${ANIMALS[R.animal].n.toLowerCase()} adulta, sana y que no esté produciendo`;
  if(R.spec&&!pickHorse(R.horse))return `Necesitas un caballo adulto con entrenamiento ${R.horse}+`;
  return '';
}
function startRecipe(fid,rid){
  const why=canMake(fid,rid);if(why){toast(why);return false}
  const R=RECIPES[rid],f=S.fab[fid];
  for(const[k,q]of Object.entries(R.in||{}))take(k,q);
  const job={r:rid,d:recipeTime(fid,rid),s:0};
  if(R.animal){const a=pickAnimal(R.animal);job.extra=breedOf(a).meat||0;S.animals=S.animals.filter(x=>x!==a);live.delete(a.id);queue=queue.filter(t=>t.ref!==a.id);toast(`${ANIMALS[a.type].n} #${a.id} se fue al rastro`)}
  if(R.spec){const a=pickHorse(R.horse);a.away=true;job.aid=a.id;live.delete(a.id);queue=queue.filter(t=>t.ref!==a.id);toast(`Caballo #${a.id} entra al centro ecuestre`)}
  f.jobs.push(job);f.last=rid;addXp(1);return true;
}
function buildFab(id){
  const f=S.fab[id],D=FACT[id],nl=f.lv+1,C=D.cost[nl-1],req=D.lv+(nl-1)*2;
  if(!C||f.buildEnd)return;
  if(D.zone&&!zoneLv(D.zone)){toast(`Primero abre la ${ZONES[D.zone].n.toLowerCase()}`);return}
  if(S.lvl<req){toast(`Requiere nivel ${req}`);return}
  if(houseLv()<nl){toast(`Primero mejora tu casa a nivel ${nl}`);return}
  if(S.coins<C.c){toast(`Necesitas ${fmt(C.c)} monedas`);return}
  for(const[k,q]of Object.entries(C.m))if((S.mats[k]||0)<q){toast(`Te faltan ${q-(S.mats[k]||0)} ${MATS[k].i} ${MATS[k].n.toLowerCase()}`);return}
  S.coins-=C.c;for(const[k,q]of Object.entries(C.m))S.mats[k]-=q;
  if(f.jobs[0]&&f.jobs[0].s){const j=f.jobs[0];j.d=Math.max(500,j.s+j.d-now());j.s=0}
  f.lv=nl;f.buildEnd=now()+8000*nl;sfx('build');addXp(8*nl);toast(nl===1?`¡Empezó la construcción de ${D.n.toLowerCase()}!`:`Mejorando ${D.n.toLowerCase()} a nivel ${nl}`);
}
function missingMats(id){const f=S.fab[id],C=FACT[id].cost[f.lv];if(!C)return{};const m={};for(const[k,q]of Object.entries(C.m)){const d=q-(S.mats[k]||0);if(d>0)m[k]=d}return m}
function processFabs(t){
  let changed=false;
  for(const[id,f]of Object.entries(S.fab)){
    if(f.buildEnd&&t>=f.buildEnd){f.buildEnd=0;changed=true;toast(`¡${FACT[id].n} nivel ${f.lv} listo!`)}
    if(f.buildEnd||!f.lv)continue;
    while(f.jobs.length){const j=f.jobs[0];if(!j.s)j.s=t;if(t<j.s+j.d)break;
      const R=RECIPES[j.r];
      if(R.spec){const a=S.animals.find(x=>x.id===j.aid);if(a){a.away=false;a.spec=R.spec;a.s=0;a.d=0;spawnLive(a,true);toast(`¡Tu caballo #${a.id} ahora es ${SPECS[R.spec].n.toLowerCase()}!`)}}
      else{let first=true;for(const[k,q]of Object.entries(R.out)){f.ready[k]=(f.ready[k]||0)+q+(first?(j.extra||0):0);first=false}}
      addXp(2*R.lv);f.jobs.shift();sfx('ready');if(f.jobs[0])f.jobs[0].s=j.s+j.d;changed=true}
  }
  if(changed){save();refreshUI()}
}
function fabStatus(id){
  const f=S.fab[id],D=FACT[id];
  if(f.buildEnd)return `Construyendo nivel ${f.lv} · <span data-pe="${f.buildEnd}"></span>`;
  if(!f.lv)return D.zone&&!zoneLv(D.zone)?`Abre primero la ${ZONES[D.zone].n.toLowerCase()}`:S.lvl<D.lv?`Se desbloquea en nivel ${D.lv}`:'Sin construir';
  const rk=Object.entries(f.ready);
  if(rk.length)return 'Listo para recoger: '+rk.map(([k,q])=>`${itemInfo(k).i} ${q}`).join(' ');
  if(f.jobs.length)return `Haciendo ${recipeName(f.jobs[0].r).toLowerCase()} · ${f.jobs.length} en fila`;
  return 'Sin trabajo';
}

function claimed(kind,ref,exceptW){
  if(queue.some(t=>t.kind===kind&&t.ref===ref)||(F.task&&F.task.kind===kind&&F.task.ref===ref))return true;
  for(const w of wlive.values())if(w!==exceptW&&w.task&&w.task.kind===kind&&w.task.ref===ref)return true;
  return false;
}
function enqueue(task){doTask(task);return true}
let buyArm=null,buyArmT=0;
function plotTarget(i){const p=plotPos(i);return {x:p.x+PLOT.w/2,y:p.y+PLOT.h+6}}
function animalTarget(id){const l=live.get(id);return l?{x:l.x-22*l.dir,y:l.y+4}:null}
const taskPos=t=>{
  if(t.kind==='gather'){const n=NODES.find(x=>x.id===t.ref);return n?{x:n.x-24,y:n.y+6}:null}
  if(t.kind==='plant'||t.kind==='harvest'||t.kind==='fert')return plotTarget(t.ref);
  if(t.kind==='feed'||t.kind==='collect')return animalTarget(t.ref);
  if(t.kind==='order'){const n=npcs.find(x=>x.id===t.ref);return n?{x:n.x+28,y:n.y+6}:null}
  if(t.kind==='buyplot')return plotTarget(t.ref);
  return {x:t.x,y:t.y};
};
function doTask(t){
  switch(t.kind){
    case 'plant':{const p=S.plots[t.ref];if(!p||p.c)return;const c=t.crop,cr=CROPS[c];
      if(S.coins<cr.cost){toast(`Necesitas ${cr.cost} monedas para sembrar ${cr.n}`);return}
      const wq=cropWater(c);if(S.water<wq){waterWarn('regar al sembrar');return}S.water-=wq;
      S.coins-=cr.cost;p.c=c;p.last=c;p.s=now();p.d=growTime(c);p.bonus=0;addXp(.2);sfx('plant');break}
    case 'harvest':{const p=S.plots[t.ref];if(!p||plotState(p)!=='ready')return;const cr=CROPS[p.c];
      const q=cr.y+S.up.semillas+p.bonus+(t.trac?1:0);
      if(!fits(p.c,q)){toast(fullMsg(p.c));return}
      S.inv[p.c]=have(p.c)+q;addXp(cr.xp);sfx('harvest');const pp=plotPos(t.ref);floatText(pp.x+45,pp.y+35,`+${q} ${cr.i}`,undefined,40);
      p.c=null;p.s=0;p.d=0;p.bonus=0;
      if(t.replant&&S.coins>=CROPS[t.replant].cost){p.c=t.replant;S.coins-=CROPS[t.replant].cost;p.s=now();p.d=growTime(t.replant)}
      break}
    case 'fert':{const p=S.plots[t.ref];if(!p||plotState(p)!=='grow')return;const f=t.fert;
      if(!S.ferts[f]){toast(`No tienes ${FERTS[f].n}. Cómpralo en la Tienda.`);return}
      S.ferts[f]--;sfx('fert');const rem=p.s+p.d-now();
      if(f==='fert'){p.d-=rem/2;p.bonus+=1}else{p.d=now()-p.s;p.bonus+=2}
      const pp=plotPos(t.ref);floatText(pp.x+45,pp.y+35,f==='fert'?'¡Fertilizado!':'¡Listo!','#c9f2ff',40);break}
    case 'feed':{const a=S.animals.find(x=>x.id===t.ref);if(!a||animalState(a)!=='hungry')return;
      if(!canFeed(a.type)){toast(`Te falta alimento: ${feedText(a.type)}`);return}
      {const wq=animalWater(a);if(S.water<wq){waterWarn('dar de beber a tus animales');return}S.water-=wq}
      for(const[k,q]of Object.entries(ANIMALS[a.type].feed))S.inv[k]-=q;
      a.s=now();a.d=animTime(a.type)*(a.stage<2?.8:1)*(breedOf(a).time||1)*penMult(penOfType(a.type));sfx('feed');const l=live.get(a.id);if(l)floatText(l.x,l.y,'¡Ñam!',undefined,50);break}
    case 'collect':{const a=S.animals.find(x=>x.id===t.ref);if(!a||animalState(a)!=='ready')return;
      const A=ANIMALS[a.type],l=live.get(a.id);
      if(a.stage<2){a.stage++;if(l)floatText(l.x,l.y,a.stage===2?'¡Ya es adulto!':'¡Creció!','#fff1b8',55)}
      else if(A.prod){if(!fits(A.prod,1)){toast(fullMsg(A.prod));return}S.inv[A.prod]=have(A.prod)+1;if(l)floatText(l.x,l.y,`+1 ${PRODUCTS[A.prod].i}`,undefined,55)}
      else{a.train=Math.min(HORSE_MAX,a.train+1);if(l)floatText(l.x,l.y,`Entrenamiento ${a.train}/${HORSE_MAX}`,'#fff1b8',55)}
      addXp(A.xp);a.s=0;a.d=0;sfx('collect');if(Math.random()<.5)sfx('animal',a.type);
      if(a.vac>0)a.vac=Math.max(0,a.vac-1);else if(Math.random()<sickChance(a)){a.sick=true;sfx('sick');toast(`¡Tu ${A.n.toLowerCase()} #${a.id} se enfermó! Toca la clínica veterinaria.`)}
      break}
    case 'order':{const i=S.orders.findIndex(o=>o.id===t.ref);if(i<0)return;const o=S.orders[i];
      if(!canDeliver(o)){toast(`${o.who} espera: `+Object.entries(o.need).map(([k,q])=>`${q} ${ITEMS[k].i}`).join(' '));return}
      for(const[k,q]of Object.entries(o.need))S.inv[k]-=q;S.coins+=o.reward;addXp(o.xp);
      const n=npcs.find(x=>x.id===o.id);if(n){floatText(n.x,n.y,`+${fmt(o.reward)} 🪙`,'#ffe27a',50);n.leaving=true;n.tx=45;n.ty=H+40}
      S.orders.splice(i,1);sfx('bigcoin');toast(`${o.who} te pagó ${fmt(o.reward)} monedas`);
      setTimeout(()=>{fillOrders();syncNpcs();save();refreshUI()},5000);break}
    case 'buyplot':{if(S.plots.length!==t.ref)return;const c=plotCost();if(S.coins<c){toast(`Necesitas ${fmt(c)} monedas para esta parcela`);return}
      sfx('build');S.coins-=c;S.plots.push({c:null,s:0,d:0,bonus:0});addXp(3);toast('¡Parcela nueva!');break}
    case 'sellrun':{let earned=0;for(const c of['cosecha','producto']){const target=Math.floor(capC(c)*.6);let guard=0;
        while(storedC(c)>target&&guard++<20){let bk=null,bq=0;for(const k of Object.keys(S.inv)){if(catOf(k)!==c)continue;const keep=CROPS[k]?12:0,q=have(k)-keep;if(q>bq){bq=q;bk=k}}
          if(!bk)break;const q=Math.min(bq,storedC(c)-target);S.inv[bk]-=q;if(!S.inv[bk])delete S.inv[bk];earned+=q*price(bk)}}
      if(earned){S.coins+=earned;floatText(MARKET_POS.x,MARKET_POS.y,`+${fmt(earned)} 🪙`,'#ffe27a',80)}break}
    case 'fab':{const f=S.fab[t.ref];if(!f)return;let got=0;
      for(const[k,q]of Object.entries(f.ready)){const tk=Math.min(q,roomC(catOf(k)));if(tk>0){if(MATS[k])S.mats[k]=(S.mats[k]||0)+tk;else S.inv[k]=have(k)+tk;f.ready[k]-=tk;got+=tk}if(!f.ready[k])delete f.ready[k]}
      const P=FAB_POS[t.ref];if(got)sfx('collect');if(got)floatText(P.x,P.y,`+${got} productos`,undefined,120);
      if(Object.keys(f.ready).length)toast(`${BOD[catOf(Object.keys(f.ready)[0])].n} lleno: quedaron cosas en la fábrica`);
      if(t.w){const L=RECIPES[f.last];if(L&&!L.animal&&!L.spec){let n=0;while(n<3&&!canMake(t.ref,f.last)){startRecipe(t.ref,f.last);n++}}}
      else if(!t.np)openPanel('fab:'+t.ref);
      break}
    case 'gather':{const n=NODES.find(x=>x.id===t.ref);if(!n||!nodeAvail(n)||!nodeReady(n))return;const T=NODE_TYPES[n.type],q=nodeYield(n);if(!fits(T.mat,q)){toast(fullMsg(T.mat));return}
      S.mats[T.mat]=(S.mats[T.mat]||0)+q;S.nodes[n.id]=now()+nodeRegrow(n);floatText(n.x,n.y,`+${q} ${MATS[T.mat].i}`,undefined,44);sfx(T.snd);addXp(1);break}
    case 'house':openPanel('casa');break;
    case 'bodega':openPanel('bodega');break;
    case 'clinic':openPanel('clinica');break;
    case 'market':openPanel('pedidos');break;
  }
  save();refreshUI();
}
// cola ordenada por cercanía
function enqueueMany(tasks){
  let cx=F.x,cy=F.y,added=0;const rest=tasks.slice();
  while(rest.length){let bi=0,bd=1e9;rest.forEach((t,i)=>{const p=taskPos(t);if(!p)return;const d=Math.hypot(p.x-cx,p.y-cy);if(d<bd){bd=d;bi=i}});
    const t=rest.splice(bi,1)[0];if(enqueue(t)){added++;const p=taskPos(t);if(p){cx=p.x;cy=p.y}}}
  return added;
}

// ================= TOQUES EN EL MAPA =================
function onTap(wx,wy,hh){
  const h=hh||hitTest(wx,wy);
  switch(h.kind){
    case 'plot':{
      if(movePlotPick){movePlotPick=false;startPlace('plot',h.i);return}
      if(h.i===S.plots.length){if(buyArm!==h.i||performance.now()-buyArmT>3500){buyArm=h.i;buyArmT=performance.now();toast(`Toca otra vez para comprar esta parcela por ${fmt(plotCost())} monedas`);return}buyArm=null;enqueue({kind:'buyplot',ref:h.i});return}
      const p=S.plots[h.i],st=plotState(p),tool=S.tool;
      if(st==='ready')enqueue({kind:'harvest',ref:h.i});
      else if(st==='empty'){if(FERTS[tool]){toast('Primero siembra algo en esta parcela');return}openPicker(h.i);return}
      else{if(FERTS[tool]){if(!S.ferts[tool]){toast(`No tienes ${FERTS[tool].n}. Cómpralo en la Tienda.`);return}enqueue({kind:'fert',ref:h.i,fert:tool})}
        else toast(`${CROPS[p.c].n}: faltan ${secs(p.s+p.d-now())}. Usa fertilizante para acelerar.`)}
      break}
    case 'animal':{const a=S.animals.find(x=>x.id===h.id),st=animalState(a),A=ANIMALS[a.type];
      if(st==='hungry'){if(!canFeed(a.type)){toast(`${A.n} necesita ${feedText(a.type)}. Siembra y cosecha primero.`);return}enqueue({kind:'feed',ref:a.id})}
      else if(st==='ready')enqueue({kind:'collect',ref:a.id});
      else if(st==='sick')toast(`${A.n} #${a.id} está enfermo. Toca la clínica veterinaria para curarlo.`);
      else if(st==='done')toast(a.spec?`${SPECS[a.spec].n}: gana ${SPECS[a.spec].inc} monedas por minuto`:'Caballo campeón. Llévalo al centro ecuestre o véndelo.');
      else toast(`${A.n} ${STAGES[a.stage].toLowerCase()}: faltan ${secs(a.s+a.d-now())}`);
      break}
    case 'npc':enqueue({kind:'order',ref:h.id});break;
    case 'node':{const n=NODES.find(x=>x.id===h.id),T=NODE_TYPES[n.type];if(!nodeAvail(n)){toast(`Mejora la ${ZONES[n.zone].n.toLowerCase()} para usar este recurso`);return}

function vS(p,n,c){const m=B.m,o=B.buf;let i=B.n;const x=p[0],y=p[1],z=p[2];
  o[i++]=m[0]*x+m[4]*y+m[8]*z+m[12];o[i++]=m[1]*x+m[5]*y+m[9]*z+m[13];o[i++]=m[2]*x+m[6]*y+m[10]*z+m[14];

// elipsoide suave; cf(x,y,z,nx,ny,nz) puede pintar manchas por vértice
function eS(rx,ry,rz,col,x,y,z,ws,hs,cf){ws=ws||10;hs=hs||7;const base=toC(col),G=[];
  for(let j=0;j<=hs;j++){const th=j/hs*Math.PI,st=Math.sin(th),ct=Math.cos(th),row=[];
    for(let i=0;i<=ws;i++){const ph=i/ws*Math.PI*2,ux=st*Math.cos(ph),uy=ct,uz=st*Math.sin(ph),p=[x+ux*rx,y+uy*ry,z+uz*rz],cc=cf&&cf(p[0],p[1],p[2],ux,uy,uz);row.push({p,n:[ux/rx,uy/ry,uz/rz],c:cc?toC(cc):base})}G.push(row)}
  for(let j=0;j<hs;j++)for(let i=0;i<ws;i++){const a=G[j][i],b=G[j][i+1],c=G[j+1][i+1],d=G[j+1][i];
    if(j>0)triS(a.p,b.p,c.p,a.n,b.n,c.n,a.c,b.c,c.c);if(j<hs-1)triS(a.p,c.p,d.p,a.n,c.n,d.n,a.c,c.c,d.c)}}
// tubo suave entre dos puntos (radios r1→r2), con tapas redondas
function tb(a,b,r1,r2,col,seg,col2,cap){seg=seg||8;const c1=toC(col),c2=col2?toC(col2):c1;const d=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],L=Math.hypot(d[0],d[1],d[2])||1;d[0]/=L;d[1]/=L;d[2]/=L;
  let u=Math.abs(d[1])<.9?[0,1,0]:[1,0,0];const k=u[0]*d[0]+u[1]*d[1]+u[2]*d[2];u=[u[0]-d[0]*k,u[1]-d[1]*k,u[2]-d[2]*k];const ul=Math.hypot(u[0],u[1],u[2]);u=[u[0]/ul,u[1]/ul,u[2]/ul];
  const v=[d[1]*u[2]-d[2]*u[1],d[2]*u[0]-d[0]*u[2],d[0]*u[1]-d[1]*u[0]],R=[];for(let i=0;i<=seg;i++){const t=i/seg*Math.PI*2,c=Math.cos(t),s=Math.sin(t);R.push([u[0]*c+v[0]*s,u[1]*c+v[1]*s,u[2]*c+v[2]*s])}
  const P=(r,n,o)=>[o[0]+n[0]*r,o[1]+n[1]*r,o[2]+n[2]*r];
  for(let i=0;i<seg;i++){const n0=R[i],n1=R[i+1];triS(P(r1,n0,a),P(r1,n1,a),P(r2,n1,b),n0,n1,n1,c1,c1,c2);triS(P(r1,n0,a),P(r2,n1,b),P(r2,n0,b),n0,n1,n0,c1,c2,c2)}
  if(cap!==false){if(r1>.3)eS(r1,r1,r1,c1,a[0],a[1],a[2],seg,4);if(r2>.3)eS(r2,r2,r2,c2,b[0],b[1],b[2],seg,4)}}
function tbs(pts,rs,col,seg,col2){for(let i=0;i<pts.length-1;i++)tb(pts[i],pts[i+1],rs[i],rs[i+1],col,seg,col2&&i===pts.length-2?col2:null)}

function assignBlock(post){const role=roleFor(post),R=ROLES[role],here=S.workers.filter(w=>w.post===post),free=S.workers.filter(w=>w.role===role&&w.post!==post),full=S.workers.length>=maxWorkers();
  const what=post.startsWith('pen:')?'alimenta y recoge a los animales de este corral':post.startsWith('fab:')?'recoge lo que termina la fábrica y repite la última receta':'recolecta los recursos de esta zona';

function zonePanel(id){
  const Z=ZONES[id],L=zoneLv(id);
  let h=`<p class="sub">${Z.d}</p>`;
  if(L){h+=`<div class="note"><b>Nivel ${L}/3.</b> ${id==='bosque'?'Toca un árbol para talarlo.':id==='cantera'?'Toca una roca, el barrero o el arenal.':'Toca una veta de hierro o un montón de carbón.'} Cada recurso vuelve a estar listo después de un rato.</div><h3>Recursos</h3>`;
    for(const[tp,cs]of Object.entries(Z.counts)){const T=NODE_TYPES[tp],M=MATS[T.mat],n=NODES.filter(x=>x.zone===id&&x.type===tp),av=n.filter(nodeAvail),rd=av.filter(nodeReady).length;
      h+=`<div class="card"><div class="ava">${M.i}</div><div class="info"><div class="nm">${T.n} <span class="label">${av.length}/${cs.at(-1)}</span></div><div class="ds">Da ${T.y+L-1} ${M.n.toLowerCase()} · vuelve en ${Math.round(T.t*(1-.2*(L-1)))}s · ${rd} listos</div></div></div>`}}
  const nl=L+1,C=Z.cost[L];
  if(C){const req=Z.lv+(nl-1)*2;h+=`<h3>${L?'Mejorar zona':'Abrir zona'}</h3><p class="sub">${L?`Nivel ${nl}: más recursos, vuelven más rápido y dan más.`:'Abre la zona para empezar a recolectar.'}</p>`+
    costCard(L?`Mejorar a nivel ${nl}`:`Abrir ${Z.n.toLowerCase()}`,C,S.lvl<req?`Nivel ${req}`:houseLv()<nl?`Casa nivel ${nl}`:'',S.lvl<req||houseLv()<nl,`data-x="zoneUp" data-k="${id}"`,`data-x="zoneMiss" data-k="${id}"`)}
  else h+=`<div class="note">Esta zona está al máximo.</div>`;
  if(L)h+=assignBlock('zona:'+id);
  const ws=Object.entries(FACT).filter(([,D])=>D.zone===id);
  if(ws.length){h+=`<h3>Talleres de esta zona</h3>`;for(const[fid,D]of ws)h+=`<div class="card"><div class="ava">${D.i}</div><div class="info"><div class="nm">${D.n}</div><div class="ds">${fabStatus(fid)}</div></div><div class="acts"><button class="btn sm" data-x="openFab" data-k="${fid}">Abrir</button></div></div>`}
  return h;
}

function vehRow(w){const L=WVEH[w.role],i=w.veh||0,cur=VEHICLES[L[i]],nx=L[i+1]&&VEHICLES[L[i+1]];

function penUpgradable(k){const P=S.pens[k];if(!P.open)return S.lvl>=PEN_INFO[k].lv&&affordC(PEN_INFO[k].cost);return Object.entries(PEN_UPS).some(([u,U])=>{const l=P[u];return l<U.costs.length&&l<=S.house&&affordC(U.costs[l])})}
function fabUpgradable(id){const f=S.fab[id],D=FACT[id],C=D.cost[f.lv];if(!C||f.buildEnd||(D.zone&&!zoneLv(D.zone)))return false;return S.lvl>=D.lv+f.lv*2&&houseLv()>=f.lv+1&&affordC(C)}

function houseUpgradable(){const nx=HOUSES[S.house+1];return !!nx&&S.lvl>=nx.lv&&S.coins>=nx.cost}
function bodUpgradable(c){const nx=S.bod[c]+1;return nx<BOD[c].cap.length&&S.house>=nx-1&&S.coins>=BOD[c].cost[nx]}

    case 'goOrder':enqueue({kind:'order',ref:b.dataset.id});return;
    case 'contract':{const i=S.contracts.findIndex(o=>o.id===b.dataset.id);if(i<0)return;const o=S.contracts[i];if(!canDeliver(o))return;for(const[q,n]of Object.entries(o.need)){S.inv[q]-=n;if(!S.inv[q])delete S.inv[q]}S.coins+=o.reward;addXp(o.xp);S.contracts.splice(i,1);sfx('bigcoin');toast(`${o.who} te pagó ${fmt(o.reward)} monedas`);floatText(MARKET_POS.x,MARKET_POS.y,`+${fmt(o.reward)} 🪙`,'#ffe27a',80);setTimeout(()=>{fillOrders();save();if(openName==='pedidos')renderPanel()},8000);break}
    case 'skipContract':{const i=S.contracts.findIndex(o=>o.id===b.dataset.id);if(i>=0)S.contracts[i]=makeContract();break}
    case 'skipOrder':{const i=S.orders.findIndex(o=>o.id===b.dataset.id);if(i>=0){S.orders[i]=makeOrder();const n=npcs.find(n=>n.id===b.dataset.id);if(n){n.leaving=true;n.tx=45;n.ty=H+40}syncNpcs()}break}
    case 'sell1':case 'sellAll':{const q=x==='sell1'?1:have(k),v=price(k)*q;S.inv[k]-=q;if(!S.inv[k])delete S.inv[k];S.coins+=v;sfx('coin');toast(`Vendiste ${q} ${ITEMS[k].i} por ${fmt(v)} monedas`);break}
    case 'sellAnimal':{const a=S.animals.find(y=>y.id==b.dataset.id);if(!a)return;
      if(pendingSell!==a.id){pendingSell=a.id;clearTimeout(pendingT);pendingT=setTimeout(()=>{pendingSell=null;if(openName==='animales')renderPanel()},3000);break}
      const v=animalValue(a);S.coins+=v;sfx('coin');S.animals=S.animals.filter(y=>y!==a);live.delete(a.id);pendingSell=null;queue=queue.filter(t=>t.ref!==a.id);toast(`Vendiste ${ANIMALS[a.type].n} por ${fmt(v)} monedas`);break}
    case 'buyAnimal':{const A=ANIMALS[k],bk=b.dataset.b,B=BREEDS[k][bk],pr=Math.round(A.buy*B.cost);if(!S.pens[A.pen].open){toast(`Primero abre el ${PENS[A.pen].n.toLowerCase()}`);return}if(penCount(A.pen)>=penCap(A.pen)){toast('Corral lleno. Amplíalo desde su letrero en el mapa.');return}if(S.coins<pr){toast(`Necesitas ${fmt(pr)} monedas`);return}
      S.coins-=pr;const a={id:S.nextId++,type:k,breed:bk,stage:0,s:0,d:0,sick:false,vac:0,train:0};S.animals.push(a);spawnLive(a,true);addXp(2);sfx('animal',k);toast(`¡Llegó una cría ${B.n}! Está en ${PENS[A.pen].n.toLowerCase()}.`);break}
    case 'buyFert':{const f=FERTS[k],n=+b.dataset.n;if(S.coins<f.cost*n){toast(`Necesitas ${f.cost*n} monedas`);return}S.coins-=f.cost*n;S.ferts[k]=(S.ferts[k]||0)+n;toast(`Compraste ${n} ${f.n}`);break}
    case 'upgrade':{const U=UPGRADES[k],c=U.costs[S.up[k]];if(houseLv()<S.up[k]+1){toast(`Primero mejora tu casa a nivel ${S.up[k]+1}`);return}if(S.coins<c)return;S.coins-=c;S.up[k]++;toast(`${U.n}: nivel ${S.up[k]}`);break}
    case 'upHouse':{const nx=HOUSES[S.house+1];if(!nx||S.coins<nx.cost||S.lvl<nx.lv)return;S.coins-=nx.cost;S.house++;sfx('build');addXp(10);fillOrders();syncNpcs();toast(`¡Casa nivel ${houseLv()}: ${nx.n.toLowerCase()}! Se desbloquearon nuevas mejoras y pedidos.`);break}
    case 'buyVeh':{const v=VEHICLES[k];if(S.coins<v.cost)return;S.coins-=v.cost;S.veh.push(k);S.vehicle=k;toast(`¡Estrenas ${v.n.toLowerCase()}!`);break}
    case 'useVeh':S.vehicle=k;break;
    case 'upBod':{const Bc=BOD[k],nx=S.bod[k]+1;if(nx>=Bc.cap.length)return;if(houseLv()<nx){toast(`Primero mejora tu casa a nivel ${nx}`);return}if(S.coins<Bc.cost[nx])return;S.coins-=Bc.cost[nx];S.bod[k]=nx;S.bodega=S.bod.cosecha;sfx('build');toast(`${Bc.n} ampliado a ${Bc.cap[nx]} espacios`);break}
    case 'upBodega':{const nx=S.bodega+1;if(S.coins<BODEGA_COST[nx])return;S.coins-=BODEGA_COST[nx];S.bodega=nx;sfx('build');toast(`Bodega ampliada a ${BODEGA_CAP[nx]} espacios`);break}
    case 'toSell':openPanel('vender');return;
    case 'rename':askFarmName(false);return;
    case 'openFab':openPanel('fab:'+k);return;
    case 'openZone':openPanel('zona:'+k);return;
    case 'openPen':openPanel('pen:'+k);return;
    case 'go':openPanel(k);return;
    case 'zoneUp':{const Z=ZONES[k],L=zoneLv(k),C=Z.cost[L],req=Z.lv+L*2;if(!C)return;if(S.lvl<req){toast(`Requiere nivel ${req}`);return}if(houseLv()<L+1){toast(`Primero mejora tu casa a nivel ${L+1}`);return}if(!payCost(C))return;S.zones[k]=L+1;sfx('build');addXp(5*(L+1));toast(L?`${Z.n} mejorado a nivel ${L+1}`:`¡Abriste el ${Z.n.toLowerCase()}!`);break}
    case 'zoneMiss':{const Z=ZONES[k],C=Z.cost[zoneLv(k)];if(C)buyMissingFor(C.m);break}
    case 'penOpen':{const I=PEN_INFO[k];if(S.lvl<I.lv){toast(`Requiere nivel ${I.lv}`);return}if(!payCost(I.cost))return;S.pens[k].open=1;sfx('build');addXp(8);toast(`¡Abriste el ${PENS[k].n.toLowerCase()}!`);break}
    case 'penOpenMiss':buyMissingFor(PEN_INFO[k].cost.m);break;
    case 'penUp':{const u=b.dataset.u,U=PEN_UPS[u],l=S.pens[k][u],C=U.costs[l];if(!C)return;if(l>S.house){toast(`Primero mejora tu casa a nivel ${l+1}`);return}if(!payCost(C))return;S.pens[k][u]=l+1;sfx('build');addXp(3);toast(`${U.n} mejorado a nivel ${l+1}`);break}
    case 'penUpMiss':{const u=b.dataset.u,C=PEN_UPS[u].costs[S.pens[k][u]];if(C)buyMissingFor(C.m);break}
    case 'goFab':doTask({kind:'fab',ref:k,np:true});return;
    case 'fabStop':case 'fabCancel':{const f=S.fab[k];if(!f)return;const keep=[];let n=0;
      f.jobs.forEach((j,i)=>{const R=RECIPES[j.r];if((x==='fabStop'||i==+b.dataset.i)&&!R.animal&&!R.spec){refundIn(R);n++}else keep.push(j)});
      const wasFirst=f.jobs[0]&&keep[0]!==f.jobs[0];f.jobs=keep;if(wasFirst&&f.jobs[0])f.jobs[0].s=now();
      if(x==='fabStop'){f.last=null;toast(n?`Producción detenida: te devolvimos los ingredientes de ${n} ${n>1?'tandas':'tanda'}. Elige qué hacer ahora.`:'Producción detenida. Elige qué hacer ahora.')}else toast('Tanda cancelada: ingredientes devueltos');break}
    case 'make':{const Rr=RECIPES[k];if(!startRecipe(Rr.f,k))return;break}
    case 'buildFab':buildFab(k);break;
    case 'buyMissing':{const miss=missingMats(k),mc=Object.entries(miss).reduce((a,[m,q])=>a+q*MATS[m].p,0);if(S.coins<mc)return;S.coins-=mc;for(const[m,q]of Object.entries(miss))S.mats[m]=(S.mats[m]||0)+q;toast(`Compraste los materiales por ${fmt(mc)} monedas`);break}
    case 'buyMat':{const m=MATS[k],n=+b.dataset.n;if(!fits(k,n)){toast(fullMsg(k));return}if(S.coins<m.p*n)return;S.coins-=m.p*n;S.mats[k]=(S.mats[k]||0)+n;toast(`Compraste ${n} ${m.i} ${m.n.toLowerCase()}`);break}
    case 'hire':hireWorker(k);break;
    case 'placeStart':startPlace(k);return;
    case 'placeMovePlot':movePlotPick=true;closePanel();toast('Toca la tierra que quieres mover');return;
    case 'styleOpen':styleTgt=k;openPanel('estilo');return;
    case 'styleTgt':styleTgt=k;break;
    case 'cosBuy':{const I=COS_ITEMS[k];if(!I||!cosAvail(k)||S.cos.own[k])return;if(S.coins<I.p){toast(`Necesitas ${fmt(I.p)} monedas`);return}S.coins-=I.p;S.cos.own[k]=true;(S.cos.eq[styleTgt]=S.cos.eq[styleTgt]||{})[I.slot]=k;sfx('build');toast(`¡${I.n} en ${tgtName(styleTgt).toLowerCase()}!`);break}
    case 'cosEq':{const I=COS_ITEMS[k];if(!S.cos.own[k])return;(S.cos.eq[styleTgt]=S.cos.eq[styleTgt]||{})[I.slot]=k;sfx('click');break}
    case 'cosOff':{const E=S.cos.eq[styleTgt];if(E){delete E[k]}break}
    case 'watUp':{const L=S.wat[k],n=L+1,C=WT[k][n];if(!C)return;if(houseLv()<wReq(k,n)){toast(`Primero mejora tu casa a nivel ${wReq(k,n)}`);return}if(!payCost(C))return;S.wat[k]=n;sfx('build');addXp(4*n);toast(`¡Listo: ${C.n.toLowerCase()}!`);break}
    case 'watMiss':{const C=WT[k][S.wat[k]+1];if(C)buyMissingFor(C.m);break}
    case 'wVeh':{const w=S.workers.find(x=>x.id==b.dataset.id);if(!w)return;const L=WVEH[w.role],nx=VEHICLES[L[(w.veh||0)+1]];if(!nx)return;if(S.house<nx.house){toast(`Requiere casa nivel ${nx.house+1}`);return}if(S.coins<nx.cost)return;S.coins-=nx.cost;w.veh=(w.veh||0)+1;sfx('build');toast(`${w.name} ahora usa ${nx.n.toLowerCase()}`);break}
    case 'hireHere':hireWorker(k,b.dataset.p);break;
    case 'assign':case 'unassign':{const w=S.workers.find(x=>x.id==b.dataset.id);if(!w)return;w.post=x==='assign'?b.dataset.p:null;const l=wlive.get(w.id);if(l){l.task=null;l.work=0}toast(x==='assign'?`${w.name} ahora trabaja en ${postName(w.post).toLowerCase()}`:`${w.name} vuelve a trabajar en toda la granja`);break}
    case 'penCollect':case 'penFeed':{let n=0;quiet=true;try{for(const a of S.animals.filter(a=>penOfType(a.type)===k&&!a.away)){const st=animalState(a);if(x==='penCollect'&&st==='ready'){doTask({kind:'collect',ref:a.id});n++}else if(x==='penFeed'&&st==='hungry'&&canFeed(a.type)){doTask({kind:'feed',ref:a.id});n++}}}finally{quiet=false}
      toast(x==='penCollect'?`Recogiste de ${n} animales`:`Alimentaste ${n} animales`);break}
    case 'toggleW':{const w=S.workers.find(x=>x.id==b.dataset.id);if(w){w.active=!w.active;const l=wlive.get(w.id);if(l){l.task=null;l.work=0}}break}
    case 'fireW':{const w=S.workers.find(x=>x.id==b.dataset.id);if(!w)return;
      if(pendingFire!==w.id){pendingFire=w.id;setTimeout(()=>{pendingFire=null;if(openName==='equipo')renderPanel()},3000);break}
      S.workers=S.workers.filter(x=>x!==w);wlive.delete(w.id);pendingFire=null;toast(`${w.name} dejó la granja`);break}
    case 'cure':{const sick=S.animals.filter(a=>a.sick);const c=VET_CURE*sick.length;if(S.coins<c)return;S.coins-=c;sick.forEach(a=>{if(!vet.jobs.some(j=>j.id===a.id))vet.jobs.push({id:a.id,kind:'cure'})});vet.active=true;vet.home=false;toast('El veterinario va en camino');break}
    case 'vac':{const nv=S.animals.filter(a=>!a.vac&&!a.sick&&!a.vacPending);const c=VET_VAC*nv.length;if(S.coins<c)return;S.coins-=c;nv.forEach(a=>{a.vacPending=true;vet.jobs.push({id:a.id,kind:'vac'})});vet.active=true;vet.home=false;toast('El veterinario saldrá a vacunar');break}
    case 'reset':{if(!confirmReset){confirmReset=true;renderPanel();return}S=fresh();rollPrices();S.contracts=[];S.cos={own:{},eq:{}};endPlace();S.bod={cosecha:0,producto:0,material:0};S.water=80;S.wat={tank:0,pump:0,rain:0};fillOrders();syncPlace();live.clear();wlive.clear();for(const id of Object.keys(FACT))S.fab[id]={lv:0,buildEnd:0,jobs:[],ready:{},last:null};S.animals.forEach(a=>spawnLive(a));npcs.length=0;syncNpcs();npcs.forEach(n=>{n.x=n.tx;n.y=n.ty});queue=[];F.task=null;F.work=0;F.x=S.farmer.x;F.y=S.farmer.y;confirmReset=false;closePanel();save();refreshUI();toast('Granja nueva. ¡Suerte!');return}
  }
  save();refreshUI();
});

// arranque
$('cloudBtn').addEventListener('click',()=>openPanel('cuenta'));renderCloudBtn();cloudInit();
document.addEventListener('visibilitychange',()=>{if(document.hidden)cloudPush(false)});
$('placeBar').addEventListener('click',e=>{const b=e.target.closest('[data-pl]');if(!b||b.disabled)return;if(b.dataset.pl==='ok')confirmPlace();else{endPlace();toast('Cancelado')}});
$('waterPill').addEventListener('click',()=>openPanel('agua'));$('storePill').addEventListener('click',()=>openPanel('bodega'));
$('sheetBody').addEventListener('change',e=>{const sl=e.target.closest('select[data-wpost]');if(!sl)return;const w=S.workers.find(x=>x.id==sl.dataset.wpost);if(!w)return;w.post=sl.value||null;const l=wlive.get(w.id);if(l){l.task=null;l.work=0}save();renderPanel()});
renderSoundBtn();$('soundBtn').addEventListener('click',()=>{const m=soundMode();setSoundMode(m==='todo'?'efectos':m==='efectos'?'silencio':'todo');toast(m==='todo'?'Solo efectos de sonido':m==='efectos'?'Sonido apagado':'Música y efectos encendidos')});
refreshUI();renderStatus();
set3d(S.view!=='iso',true);
if(S.seenIntro&&!S.place.granero)setTimeout(()=>{toast('Coloca tu granero: lo arrastras a la zona verde.');startPlace('granero')},1500);
{const e=evActive()[0];if(e&&S.seenIntro)setTimeout(()=>toast(`${e.i} Evento especial: ${e.n}. Personaliza tu rancho en Mejorar → Estilo y eventos.`),3500)}
requestAnimationFrame(frame);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
setInterval(save,5000);
if(!S.farmName)setTimeout(()=>askFarmName(true),400);
else if(!S.seenIntro){S.seenIntro=true;save();setTimeout(()=>toast((S.place.granero?'Toca una parcela para elegir qué sembrar. Cuando esté lista, tócala para cosechar.':'¡Bienvenido! Primero coloca tu granero: toca 🏗️ Construir.')),600)}
$('brandBtn').addEventListener('click',()=>askFarmName(false));
})();
</script>

<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
